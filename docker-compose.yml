services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infra}
      POSTGRES_USER: ${POSTGRES_USER:-infra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infra_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infra} -d ${POSTGRES_DB:-infra}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /app
    volumes:
      - ./backend:/app
      - uploads:/data/uploads
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://infra:infra_dev_password@db:5432/infra}
      JWT_SECRET: ${JWT_SECRET:-replace-this-development-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DEV_MODE: ${DEV_MODE:-true}
      UPLOAD_DIR: /data/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000/api/v1}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://0.0.0.0:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  mock:
    build: ./mock
    command: uvicorn mock_api:app --host 0.0.0.0 --port 4000
    working_dir: /app
    volumes:
      - ./mock:/app
    ports:
      - "4000:4000"

volumes:
  pgdata:
  uploads:
  frontend_node_modules:
