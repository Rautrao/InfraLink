services:
  - type: web
    name: infralink-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: infralink-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: infralink-frontend
    env: node
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NEXT_PUBLIC_API_BASE
        fromService:
          type: web
          name: infralink-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: infralink-db
    databaseName: infralink
    user: infralink
    plan: free
